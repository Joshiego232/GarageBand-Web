name: Expand merged DAW source
on:
  push:
    branches: [merge-soundstage-daw]
    paths: ['.bundle/part-*']
permissions:
  contents: write
jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Expand source bundle
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f .bundle/part-00 ]; then
            echo "No pending source bundle; nothing to do."
            exit 0
          fi
          cat .bundle/part-* > .merge-bundle.tar.xz
          mkdir -p .merge-unpack
          # The uploaded XZ stream contains a gzip-compressed tar archive.
          xz -dc .merge-bundle.tar.xz | tar -xzf - -C .merge-unpack
          cp -a .merge-unpack/. .
          rm -rf .merge-unpack .bundle .merge-bundle.tar.xz
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes found."
            exit 0
          fi
          git commit -m "Import merged GarageBand Web Studio source"
          git push origin "HEAD:${{ github.ref_name }}"
